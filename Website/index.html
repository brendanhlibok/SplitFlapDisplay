<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Motor Controller</h1>
    <div>
        Steps to move<br>
        <textarea id="steps to move" rows="1" cols="40" placeholder="Type # of steps to move..."></textarea>
    </div>
    <div>
        Direction<br>
        <input type="radio" id="dir" name="cw" value="1">
        <label for="cw">Clockwise</label>
        <input type="radio" id="dir" name="ccw" value="-1">
        <label for="ccw">Counterclockwise</label>
    </div>
    <br>
    <div> 
        <button id="spin">Spin</button>
    </div>
    <script src="index.js"></script>
</body>
</html>
